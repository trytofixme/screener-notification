plugins {
    id "org.springframework.boot" version "3.3.3"
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

subprojects {
    apply plugin: 'java'

    group = 'ru.screener'
    version = '1.0'

    repositories {
        mavenCentral()
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn(tasks.named("test"))
        reports {
            xml.required = true
            html.required = true
            csv.required = true
            xml.destination file("${buildDir}/reports/jacoco.xml")
            csv.destination file("${buildDir}/reports/jacoco.csv")
            html.destination file("${buildDir}/reports/jacoco.html")
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

tasks.register('generateMergedReport', JacocoReport) {
    dependsOn subprojects.jacocoTestReport
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.sourceSets.main.output)
    executionData.setFrom project.fileTree(dir: '.', include: '**/build/jacoco/test.exec')
    reports {
        xml.required = false
        csv.required = true
        html.required = true
        csv.destination file("${project.buildDir}/reports/jacoco.csv")
        xml.destination file("${project.buildDir}/reports/jacoco.xml")
    }
}

jar {
    enabled = false
}

build {
    finalizedBy generateMergedReport
}

test {
    finalizedBy generateMergedReport
}
