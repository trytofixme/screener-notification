spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      client.dns.lookup: use_all_dns_ips
    listener:
      ack-mode: manual

app:
  kafka:
    topic:
      notification:
        name: notification.send
        partitions: 3

server:
  port: 8082

telegram:
  bot-token: 8410759213:AAHMQMTEt3RThPDTAXq_0JVb5XrHNUelgy4
  api-base-url: https://api.telegram.org
  methods:
    send-message: /sendMessage
  timeouts:
    connect-ms: 3000
    read-ms: 15000
  ratelimit:
    per-chat-min-interval-ms: 1000
    max-global-rps: 25
  retry:
    too-many-requests-max: 3
    transient-max: 5
    base-ms: 300
    base-429-ms: 500
    max-ms: 5000
    jitter-low: 0.1
    jitter-high: 0.2
  http:
    max-in-memory-bytes: 1048576

logging:
  level:
    root: info

---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  health:
    kafka:
      enabled: false